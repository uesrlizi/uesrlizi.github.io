<html lang="zh-CN" data-lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>李璟涵 · 作品集</title>
  <meta name="description" content="李璟涵的游戏作品集——技术美术 / 游戏工程师 / AI场景美术 / 申研作品集。你在找的是？">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e0f13'/%3E%3Cpath d='M8 22V10l8 8 8-8v12' stroke='%235eead4' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css?v=7">
  <style>
    /* ===== 首页：方案G 抉择卡牌（海报占满首屏；页脚在文档流末尾，滚动才见） ===== */
    body.home-page{min-height:100dvh;display:flex;flex-direction:column}
    body.home-page::before{
      background:
        radial-gradient(1050px 620px at 50% 58%, rgba(214,226,244,.055), transparent 70%),
        radial-gradient(115% 95% at 50% 40%, transparent 52%, rgba(2,3,6,.62) 100%);
    }
    /* width:100% 必须显式：flex 交叉轴上 margin:0 auto 会压制 stretch，
       导致 main 按内容收缩（zh 卡名窄 → 整页变窄 → 卡牌变小） */
    body.home-page main{max-width:none;width:100%;padding:0;flex:1 0 auto;display:flex;flex-direction:column;
      min-height:calc(100dvh - 56px)}
    body.home-page .site-header{flex:none}
    body.home-page .site-footer{flex:none;border-top:1px solid var(--border)}

    .stage{position:relative;z-index:3;flex:1 0 auto;display:flex;flex-direction:column;padding:0 30px}
    /* 标题区与卡片区对半分享剩余高度：标题在卡牌上方空间里垂直居中 */
    .head{position:relative;z-index:2;flex:1 0 auto;display:flex;flex-direction:column;
      justify-content:center;align-items:center;padding:18px 0 8px}
    .question{position:relative;z-index:2;text-align:center;margin:0;font-weight:900;
      font-size:clamp(44px,5.2vw,74px);line-height:1.12;letter-spacing:.06em;user-select:none}
    .question em{font-style:normal;color:var(--accent);transition:color .5s, text-shadow .5s;
      text-shadow:0 0 34px color-mix(in srgb,var(--accent) 35%,transparent)}
    body.playing .question em{color:var(--live);
      text-shadow:0 0 34px color-mix(in srgb,var(--live) 35%,transparent)}
    .q-shadow{position:relative;z-index:2;margin:12px 0 0;text-align:center;
      font-family:var(--font-mono);font-size:12px;letter-spacing:.34em;color:var(--muted);user-select:none}
    body.en-mode .q-shadow{display:none}
    /* 英文名更长：缩字号收间距防溢出 */
    body.en-mode .name{font-size:clamp(13px,1.25vw,18px);letter-spacing:.1em}

    #dust{position:fixed;inset:0;z-index:0;pointer-events:none}
    #glow{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity .5s ease;
      background:radial-gradient(1000px 660px at 50% 62%, color-mix(in srgb,var(--live) 14%,transparent), transparent 72%)}
    body.playing #glow{opacity:1;animation:flick .6s ease-out backwards}
    @keyframes flick{0%{opacity:0}30%{opacity:.9}45%{opacity:.35}65%{opacity:1}100%{opacity:1}}

    /* --- 四卡牌（3D 扇面；窄窗先缩间距再缩卡） --- */
    .stage3d{--fanGap:clamp(14px,2.8vw,40px);
      flex:1 0 auto;min-height:380px;position:relative;display:flex;align-items:center;justify-content:center;
      gap:var(--fanGap);perspective:1500px;perspective-origin:50% 44%}
    .stage3d::before{content:"";position:absolute;left:50%;bottom:8%;width:900px;height:120px;
      transform:translateX(-50%);z-index:0;
      background:radial-gradient(50% 50% at 50% 50%, rgba(220,232,248,.05), transparent 70%)}
    .stage3d::after{content:"";position:absolute;left:50%;bottom:18%;width:min(980px,84%);height:1px;
      transform:translateX(-50%);z-index:0;
      background:linear-gradient(90deg,transparent,rgba(233,240,250,.16),transparent)}
    .gcard{position:relative;z-index:1;display:block;
      width:min(268px,calc((100vw - 60px - 3*var(--fanGap))/4));
      aspect-ratio:268/386;height:auto;flex:none;
      transform-style:preserve-3d;cursor:pointer;user-select:none;-webkit-user-select:none;
      transition:opacity .5s ease}
    .gcard:focus{outline:none}
    .gcard:nth-of-type(1){transform:translateY(16px) rotateZ(-4.5deg) rotateY(14deg)}
    .gcard:nth-of-type(2){transform:translateY(2px) rotateZ(-1.2deg) rotateY(5deg)}
    .gcard:nth-of-type(3){transform:translateY(2px) rotateZ(1.2deg) rotateY(-5deg)}
    .gcard:nth-of-type(4){transform:translateY(16px) rotateZ(4.5deg) rotateY(-14deg)}

    .lift{display:block;height:100%;transform-style:preserve-3d;
      transform:translateY(0) translateZ(0);
      transition:transform .4s cubic-bezier(.2,.75,.25,1)}
    .gcard:hover .lift,.gcard:focus-visible .lift{transform:translateY(-16px) translateZ(64px)}
    .float{display:block;height:100%;transform-style:preserve-3d}
    .gcard:nth-of-type(1) .float{animation:floaty 5.6s ease-in-out -1.2s infinite}
    .gcard:nth-of-type(2) .float{animation:floaty 6.8s ease-in-out -3.1s infinite}
    .gcard:nth-of-type(3) .float{animation:floaty 6.2s ease-in-out -2.2s infinite}
    .gcard:nth-of-type(4) .float{animation:floaty 7.1s ease-in-out -4.3s infinite}
    @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
    .flip3d{position:relative;display:block;height:100%;transform-style:preserve-3d;
      transition:transform .58s cubic-bezier(.4,.5,.2,1)}

    /* --- 出牌：选中的牌抬升翻面，其余收牌离场 --- */
    .gcard.play{z-index:6}
    .gcard.play .lift{transform:translateY(-30px) translateZ(190px);
      transition:transform .6s cubic-bezier(.32,.66,.22,1)}
    .gcard.play .flip3d{transform:rotateY(180deg)}
    .gcard.fold{opacity:.16;pointer-events:none}
    .gcard.fold .lift{transform:translateY(48px) translateZ(-70px)}
    @media (prefers-reduced-motion: reduce){
      .lift,.flip3d,.float,.gcard{transition:none!important;animation:none!important}
    }

    /* --- 卡面（默认信息面：图标 + 全名 + 计数） --- */
    .face{position:absolute;inset:0;border-radius:16px;overflow:hidden;
      backface-visibility:hidden;-webkit-backface-visibility:hidden;
      border:1px solid color-mix(in srgb,var(--rc) 34%,transparent);
      box-shadow:0 26px 55px -26px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.05);
      transition:border-color .35s, box-shadow .35s}
    .gcard:hover .face,.gcard:focus-visible .face{
      border-color:color-mix(in srgb,var(--rc) 68%,transparent);
      box-shadow:0 0 0 1px color-mix(in srgb,var(--rc) 28%,transparent),
        0 20px 70px -20px color-mix(in srgb,var(--rc) 38%,transparent),
        0 34px 70px -30px rgba(0,0,0,.8)}
    .gcard.play .face{
      border-color:color-mix(in srgb,var(--rc) 75%,transparent);
      box-shadow:0 0 0 1px color-mix(in srgb,var(--rc) 26%,transparent),
        0 24px 80px -24px color-mix(in srgb,var(--rc) 42%,transparent),
        0 30px 70px -30px rgba(0,0,0,.85)}
    .face::before{content:"";position:absolute;inset:9px;border:1px solid rgba(233,240,250,.08);
      border-radius:11px;pointer-events:none;z-index:3}
    .face canvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0;
      -webkit-mask-image:linear-gradient(180deg,#000 40%,transparent 90%);
      mask-image:linear-gradient(180deg,#000 40%,transparent 90%)}
    .face.info{
      background:
        radial-gradient(130% 95% at 50% 26%, color-mix(in srgb,var(--rc) 10%,transparent), transparent 62%),
        repeating-linear-gradient(115deg, rgba(233,240,250,.014) 0 1px, transparent 1px 7px),
        linear-gradient(168deg,#181b2a,#10121a 58%,#141726)}
    .face.back{
      transform:rotateY(180deg);
      background:
        radial-gradient(130% 95% at 50% 40%, color-mix(in srgb,var(--rc) 9%,transparent), transparent 62%),
        repeating-linear-gradient(115deg, rgba(233,240,250,.016) 0 1px, transparent 1px 7px),
        linear-gradient(168deg,#161826,#0e1017 55%,#12141f)}
    .face.back::after{content:"";position:absolute;inset:-40%;pointer-events:none;z-index:1;
      background:linear-gradient(100deg, transparent 42%, rgba(233,240,250,.08) 50%, transparent 58%);
      transform:translateX(-72%);animation:sheen 5.4s ease-in-out infinite}
    .gcard:nth-of-type(2) .face.back::after{animation-delay:1.3s}
    .gcard:nth-of-type(3) .face.back::after{animation-delay:2.6s}
    .gcard:nth-of-type(4) .face.back::after{animation-delay:3.9s}
    @keyframes sheen{0%,58%{transform:translateX(-72%)}82%,100%{transform:translateX(72%)}}

    .idx{position:absolute;font-family:var(--font-mono);font-size:12px;letter-spacing:.2em;
      color:var(--rc);opacity:.75;z-index:2}
    .idx.tl{top:16px;left:18px}
    .idx.br{bottom:16px;right:18px;transform:rotate(180deg)}
    .icon{position:absolute;left:0;right:0;top:34%;transform:translateY(-50%);z-index:1;
      display:flex;align-items:center;justify-content:center;
      color:var(--rc);filter:drop-shadow(0 0 14px color-mix(in srgb,var(--rc) 45%,transparent));
      transition:filter .35s}
    .gcard:hover .icon,.gcard:focus-visible .icon{
      filter:drop-shadow(0 0 22px color-mix(in srgb,var(--rc) 70%,transparent))}
    .icon svg{width:clamp(60px,6vw,86px);height:clamp(60px,6vw,86px);display:block}
    .gicon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
      z-index:1;color:var(--rc);opacity:.16;filter:drop-shadow(0 0 18px color-mix(in srgb,var(--rc) 40%,transparent))}
    .gicon svg{width:clamp(96px,9.6vw,138px);height:clamp(96px,9.6vw,138px)}
    .pip{position:absolute;left:50%;width:7px;height:7px;background:var(--rc);opacity:.55;z-index:2;
      transform:translateX(-50%) rotate(45deg)}
    .pip.top{top:21%}
    .pip.bot{bottom:21%}
    .name{position:absolute;left:0;right:0;bottom:22.5%;z-index:2;text-align:center;
      font-size:clamp(18px,1.72vw,24px);font-weight:800;letter-spacing:.3em;color:var(--text);white-space:nowrap;
      text-shadow:0 0 30px color-mix(in srgb,var(--rc) 30%,transparent), 0 2px 14px rgba(0,0,0,.6)}
    .count{position:absolute;left:50%;bottom:8.5%;transform:translateX(-50%);z-index:2;
      font-family:var(--font-mono);font-size:clamp(10px,.85vw,11.5px);letter-spacing:.22em;color:var(--rc);
      padding:5px 13px;border-radius:999px;white-space:nowrap;
      background:color-mix(in srgb,var(--rc) 10%,transparent);
      border:1px solid color-mix(in srgb,var(--rc) 28%,transparent);transition:background .3s}
    .gcard:hover .count{background:color-mix(in srgb,var(--rc) 22%,transparent)}

    /* ===== 入场（截图模式不启用，默认即终态） ===== */
    body:not(.on) .reveal{opacity:0}
    html:not(.shot) body.on .reveal{animation:rise .75s cubic-bezier(.2,.8,.2,1) backwards}
    html:not(.shot) body.on .question.reveal{animation:qin .85s cubic-bezier(.2,.8,.2,1) backwards,
      breathe 6.5s ease-in-out 1.4s infinite}
    html:not(.shot) body.on .gcard.reveal{animation:deal .8s cubic-bezier(.22,.75,.25,1) backwards}
    html:not(.shot) body.on .gcard:nth-of-type(1).reveal{animation-delay:.18s}
    html:not(.shot) body.on .gcard:nth-of-type(2).reveal{animation-delay:.3s}
    html:not(.shot) body.on .gcard:nth-of-type(3).reveal{animation-delay:.42s}
    html:not(.shot) body.on .gcard:nth-of-type(4).reveal{animation-delay:.54s}
    @keyframes rise{from{opacity:0;transform:translateY(16px)}}
    @keyframes qin{from{opacity:0;letter-spacing:.3em;transform:translateY(18px)}}
    @keyframes deal{from{opacity:0;transform:translateY(120px)}}
    @keyframes breathe{0%,100%{opacity:1}50%{opacity:.85}}

    /* ===== 截图模式 ?shot=WxH ===== */
    html.shot,html.shot body{width:var(--sw);height:var(--sh);overflow:hidden}
    html.shot body{position:relative}
    html.shot #dust,html.shot #glow{position:absolute}
    html.shot *,html.shot *::before,html.shot *::after{animation:none!important;transition:none!important}
    html.shot .reveal{opacity:1!important}
    html.shot .question{opacity:1!important;letter-spacing:.06em}
    html.shot #glow{opacity:0!important}
    html.shot .face.back::after{transform:translateX(-72%)}

    /* ===== 竖屏（≤720px，独立构图：2×2 一手牌） ===== */
    html.p body.home-page main{padding:0 18px}
    html.p .stage{padding:0}
    html.p .head{padding:10px 0 4px}
    html.p .question{font-size:clamp(34px,9vw,42px);letter-spacing:.08em;margin:0}
    html.p .q-shadow{margin:6px 0 0;font-size:10px;letter-spacing:.24em}
    html.p .stage3d{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:auto;align-content:center;
      gap:13px;margin:14px 2px 16px;perspective:900px;perspective-origin:50% 50%}
    html.p .stage3d::before{bottom:0;width:300px;height:70px}
    html.p .stage3d::after{display:none}
    html.p .gcard{width:100%;min-width:0}
    html.p .gcard:nth-of-type(1){transform:rotateZ(-1.6deg)}
    html.p .gcard:nth-of-type(2){transform:rotateZ(1.2deg)}
    html.p .gcard:nth-of-type(3){transform:rotateZ(-1.2deg)}
    html.p .gcard:nth-of-type(4){transform:rotateZ(1.6deg)}
    html.p .gcard:hover .lift,html.p .gcard:focus-visible .lift{transform:translateY(-6px) translateZ(28px)}
    html.p .gcard.play .lift{transform:translateY(-16px) translateZ(120px)}
    html.p .gcard.fold .lift{transform:translateY(26px) translateZ(-40px)}
    html.p .face{border-radius:13px}
    html.p .face::before{inset:6px;border-radius:8px}
    html.p .idx.tl{top:12px;left:14px;font-size:10px}
    html.p .idx.br{display:none}
    html.p .icon{top:30%}
    html.p .icon svg{width:48px;height:48px}
    html.p .gicon svg{width:104px;height:104px}
    html.p .pip{width:6px;height:6px}
    html.p .pip.top{top:17%}
    html.p .pip.bot{bottom:17%}
    html.p .name{bottom:23.5%;font-size:18px;letter-spacing:.22em}
    html.p body.en-mode .name{font-size:12px;letter-spacing:.08em;white-space:normal;line-height:1.35;padding:0 6px}
    html.p .count{bottom:8.8%;font-size:10px;padding:4px 12px;letter-spacing:.18em}
  </style>
</head>

  <script src="js/i18n.js?v=6"></script>
  <script src="js/data.js?v=2"></script>
  <script src="js/render.js?v=3"></script>
  <script>
    /* ========= 截图模式 ========= */
    const mShot=location.search.match(/shot=(\d+)x(\d+)/);
    const SHOT=!!mShot, SW=SHOT?+mShot[1]:0, SH=SHOT?+mShot[2]:0;
    const VW=()=>SHOT?SW:innerWidth, VH=()=>SHOT?SH:innerHeight;
    if(SHOT){
      document.documentElement.style.setProperty('--sw',SW+'px');
      document.documentElement.style.setProperty('--sh',SH+'px');
      document.documentElement.classList.add('shot');
    }

    /* ========= 竖屏断点（截图模式按锁定宽度判定） ========= */
    const mqP=matchMedia('(max-width:720px)');
    function syncP(){document.documentElement.classList.toggle('p', SHOT? SW<=720 : mqP.matches);}
    syncP();
    if(!SHOT && mqP.addEventListener) mqP.addEventListener('change',syncP);

    /* ========= 尘埃微粒 ========= */
    const cv=document.getElementById('dust'),g=cv.getContext('2d');
    const dpr=devicePixelRatio||1;
    const REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;
    let W,H,dust=[];
    function sizeCv(){
      W=cv.width=Math.round(VW()*dpr); H=cv.height=Math.round(VH()*dpr);
      cv.style.width=VW()+'px'; cv.style.height=VH()+'px';
      dust=Array.from({length:130},()=>({x:Math.random()*W,y:Math.random()*H,
        r:(Math.random()*1.2+.4)*dpr, s:(Math.random()*.02+.006)*dpr,
        p:Math.random()*Math.PI*2, a:Math.random()*.45+.12, sw:Math.random()*.6+.25}));
    }
    sizeCv();
    if(!SHOT) addEventListener('resize',sizeCv);
    function drawDust(t){
      g.clearRect(0,0,W,H); g.fillStyle='#d6e0f2';
      for(const d of dust){
        const yy=(((d.y-t*d.s)%H)+H)%H;
        const xx=d.x+Math.sin(t*.00035*d.sw+d.p)*24*dpr;
        g.globalAlpha=Math.max(0,d.a*(.55+.45*Math.sin(t*.0011+d.p)));
        g.beginPath(); g.arc(xx,yy,d.r,0,7); g.fill();
      }
      g.globalAlpha=1;
    }

    /* ========= 标题 / 影子行（双语手动渲染，保留 em 钩子） ========= */
    function renderQuestion(){
      const q=document.getElementById('q-text');
      const sh=document.getElementById('q-shadow');
      q.innerHTML = i18n.lang==='en'
        ? 'What are you looking <em>for?</em>'
        : '你在找的<em>是？</em>';
      sh.textContent = i18n.t('home.shadow');
      document.body.classList.toggle('en-mode', i18n.lang==='en');
    }

    /* ========= 卡面活体画布（低姿态，hover 能量提升） ========= */
    const SEEDS={ta:11,prog:22,ai:33,art:44};
    const RAIN_CHARS='01{}<>/;=+*#%&$@!?|:.'.split('');
    const KWS=['GODOT 4','UE 5','GDSCRIPT','C++','蓝图','轨道力学'];
    function mkSprite(rgb){
      const s=320,c=document.createElement('canvas');c.width=c.height=s;
      const x=c.getContext('2d');
      const gr=x.createRadialGradient(s/2,s/2,s*.03,s/2,s/2,s/2);
      gr.addColorStop(0,`rgba(${rgb},.85)`);gr.addColorStop(.32,`rgba(${rgb},.4)`);
      gr.addColorStop(.68,`rgba(${rgb},.1)`);gr.addColorStop(1,`rgba(${rgb},0)`);
      x.fillStyle=gr;x.fillRect(0,0,s,s);return c;
    }
    function mkStroke(rgb){
      const s=320,c=document.createElement('canvas');c.width=c.height=s;
      const x=c.getContext('2d');
      x.translate(s/2,s/2);x.rotate(-.55);x.scale(1,.3);
      const gr=x.createRadialGradient(0,0,s*.04,0,0,s/2);
      gr.addColorStop(0,`rgba(${rgb},.8)`);gr.addColorStop(.5,`rgba(${rgb},.28)`);
      gr.addColorStop(1,`rgba(${rgb},0)`);
      x.fillStyle=gr;x.fillRect(-s/2,-s/2,s,s);return c;
    }
    const AI_SPRITES=['167,139,250','138,180,255','196,150,255','148,124,236'].map(mkSprite);
    const ART_SPRITES=['224,106,78','164,74,54','232,140,96','150,64,48'].map(mkStroke);
    function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;
      let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;
      return((t^t>>>14)>>>0)/4294967296}}
    function mkColF(R){
      const kw=R()<.2;
      const str=kw?KWS[Math.floor(R()*KWS.length)]:null;
      const len=str?str.length:5+Math.floor(R()*8);
      return {x:R()*.9+.05, y:R()*-260, sp:14+R()*30, rowH:13+R()*3,
        kw, gs:str?str.split(''):Array.from({length:len},()=>RAIN_CHARS[Math.floor(R()*RAIN_CHARS.length)])};
    }

    const fields=[...document.querySelectorAll('.gcard')].map(card=>{
      const act=card.dataset.act;
      return {card, act, seed:SEEDS[act],
        cv:card.querySelector('canvas'), ctx:card.querySelector('canvas').getContext('2d'),
        w:0,h:0, energy:0, target:0, nodes:[], cols:[], blobs:[], R:null};
    });
    function buildField(f){
      const R=mulberry32(f.seed*7919+13);f.R=R;
      const {w,h}=f;
      if(f.act==='ta'){
        const n=Math.max(9,Math.min(22,Math.round(w*h/9000)));
        f.nodes=Array.from({length:n},()=>({
          x:R(),y:R(),vx:(R()<.5?-1:1)*(.006+R()*.012),vy:(R()<.5?-1:1)*(.006+R()*.012),
          r:1+R()*1.4, hub:R()<.24}));
      }else if(f.act==='prog'){
        const n=Math.max(6,Math.round(w/30));
        f.cols=Array.from({length:n},()=>mkColF(R));
      }else if(f.act==='ai'){
        f.blobs=Array.from({length:4},(_,i)=>({
          sp:AI_SPRITES[i%AI_SPRITES.length],
          x:.16+R()*.68, y:.1+R()*.5,
          ax:14+R()*30, ay:10+R()*22,
          s1:.1+R()*.22, s2:.1+R()*.22,
          p1:R()*6.28, p2:R()*6.28,
          sc:.7+R()*.8, al:.3+R()*.24}));
      }else{
        f.blobs=Array.from({length:5},(_,i)=>({
          sp:ART_SPRITES[i%ART_SPRITES.length],
          x:.14+R()*.72, y:.08+R()*.52,
          ax:12+R()*28, ay:8+R()*20,
          s1:.08+R()*.2, s2:.08+R()*.2,
          p1:R()*6.28, p2:R()*6.28,
          sc:.62+R()*.75, al:.3+R()*.24, rot:R()*6.28, rs:(R()-.5)*.05}));
      }
    }
    function fitField(f){
      const r=f.card.getBoundingClientRect();
      const w=r.width,h=r.height;
      if(!w||!h)return;
      if(f.w&&Math.abs(w-f.w)<2&&Math.abs(h-f.h)<2)return;
      f.w=w;f.h=h;
      f.cv.width=Math.round(w*dpr);f.cv.height=Math.round(h*dpr);
      f.ctx.setTransform(dpr,0,0,dpr,0,0);
      buildField(f);
    }
    function drawNodesF(f,tS,dt,e){
      const {ctx,w,h,nodes}=f,sp=1+2*e;
      for(const n of nodes){
        n.x+=n.vx*sp*dt;n.y+=n.vy*sp*dt;
        if(n.x<-.03)n.x=1.03;if(n.x>1.03)n.x=-.03;
        if(n.y<-.03)n.y=1.03;if(n.y>1.03)n.y=-.03;
      }
      const L=Math.min(w,h)*.36;
      ctx.lineWidth=1;
      for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
        const a=nodes[i],b=nodes[j];
        const d=Math.hypot((a.x-b.x)*w,(a.y-b.y)*h);
        if(d<L){
          ctx.strokeStyle=`rgba(94,234,212,${((1-d/L)*.26*(.55+.6*e)).toFixed(3)})`;
          ctx.beginPath();ctx.moveTo(a.x*w,a.y*h);ctx.lineTo(b.x*w,b.y*h);ctx.stroke();
        }
      }
      for(const n of nodes){
        ctx.fillStyle=`rgba(94,234,212,${((n.hub?.7:.45)+.2*e).toFixed(3)})`;
        ctx.beginPath();ctx.arc(n.x*w,n.y*h,n.r*(1+.3*e),0,7);ctx.fill();
      }
    }
    function drawRainF(f,dt,e){
      const {ctx,w,h,cols}=f,sp=1+1.8*e;
      ctx.font='11.5px ui-monospace,Consolas,monospace';
      ctx.textAlign='center';
      for(const c of cols){
        c.y+=c.sp*sp*dt;
        if(c.y-6>h+40)Object.assign(c,mkColF(f.R));
        const n=c.gs.length;
        for(let i=0;i<n;i++){
          const ch=c.gs[i];if(ch===' ')continue;
          const gy=c.y-i*c.rowH;if(gy<-12||gy>h+12)continue;
          const fall=1-i/n;
          const a=(c.kw?.5:.32)*(.45+.7*e)*(.35+.65*fall);
          ctx.fillStyle=c.kw?`rgba(255,180,84,${a.toFixed(3)})`:`rgba(214,201,182,${a.toFixed(3)})`;
          ctx.fillText(ch,c.x*w,gy);
        }
      }
    }
    function drawBlobsF(f,tS,e){
      const {ctx,w,h,blobs}=f,base=Math.min(w,h);
      ctx.globalCompositeOperation='lighter';
      for(const b of blobs){
        const x=b.x*w+Math.sin(tS*b.s1+b.p1)*b.ax;
        const y=b.y*h+Math.sin(tS*b.s2+b.p2)*b.ay;
        const s=base*b.sc;
        ctx.globalAlpha=Math.min(1,b.al*(.5+.6*e));
        if(b.rot!==undefined){ctx.save();ctx.translate(x,y);ctx.rotate(b.rot+tS*b.rs);ctx.drawImage(b.sp,-s/2,-s/2,s,s);ctx.restore();}
        else ctx.drawImage(b.sp,x-s/2,y-s/2,s,s);
      }
      ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
    }
    function drawField(f,tS,dt){
      if(!f.w||!f.h)return;
      const e=f.energy;
      f.ctx.clearRect(0,0,f.w,f.h);
      if(f.act==='ta')drawNodesF(f,tS,dt,e);
      else if(f.act==='prog')drawRainF(f,dt,e);
      else drawBlobsF(f,tS,e);
    }
    fields.forEach(f=>{
      f.card.addEventListener('mouseenter',()=>f.target=1);
      f.card.addEventListener('mouseleave',()=>f.target=0);
      f.card.addEventListener('focus',()=>f.target=1);
      f.card.addEventListener('blur',()=>f.target=0);
    });

    /* ========= 出牌即跳转：一步点击 + 翻面离场 ========= */
    const cards=fields.map(f=>f.card);
    const HEX={ta:'#5eead4',prog:'#ffb454',ai:'#a78bfa',art:'#e06a4e'};
    let going=false;
    cards.forEach(c=>{
      c.addEventListener('click',e=>{
        if(going){e.preventDefault();return;}
        if(REDUCE) return;                 /* 减弱动态偏好：不演戏，原生直达 */
        e.preventDefault();
        going=true;
        document.body.classList.add('playing');
        document.body.style.setProperty('--live',HEX[c.dataset.act]);
        c.classList.add('play');
        cards.forEach(o=>{if(o!==c)o.classList.add('fold');});
        setTimeout(()=>{location.href=c.getAttribute('href');},620);
      });
    });

    /* ========= 启动 ========= */
    fields.forEach(fitField);
    function drawAll(t,dt){
      drawDust(t);
      for(const f of fields){
        f.energy+=(f.target-f.energy)*Math.min(1,dt*3.5);
        drawField(f,t/1000,dt);
      }
    }
    if(SHOT||REDUCE){
      fields.forEach(fitField);
      drawAll(2400,0);                     /* 同步首帧：布局与画布一次成形 */
    }else{
      let last=performance.now();
      requestAnimationFrame(function frame(t){
        const dt=Math.min((t-last)/1000,.05);last=t;
        for(const f of fields)fitField(f);
        drawAll(t,dt);
        requestAnimationFrame(frame);
      });
    }

    /* ========= i18n + 真实计数 ========= */
    document.addEventListener('DOMContentLoaded', async () => {
      i18n.init();
      renderQuestion();
      await fillEntryCounts();
      window.addEventListener('langchange', () => { renderQuestion(); fillEntryCounts(); });
      if(SHOT||REDUCE){ document.body.classList.add('on'); }
      else requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.add('on')));
    });
  </script>
